<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f2b"><title>AniDex</title><link rel="stylesheet" href="/styles.css"></head><body><header><div><small>MIJN NATUURCOLLECTIE</small><h1>AniDex</h1></div><div class="counter"><b id="speciesCount">0</b><span>soorten</span></div></header><main><section id="scan" class="hero"><div class="paw">🐾</div><h2>Welk dier heb je gevonden?</h2><p>Maak een foto of kies er één uit je galerij.</p><label class="primary">📷 Dier scannen<input id="cameraInput" type="file" accept="image/*" capture="environment"></label><p id="status"></p></section><section id="result" class="panel hidden"><img id="preview"><p class="eyebrow">HERKEND ALS</p><h2 id="animalName"></h2><i id="latin"></i><p id="description"></p><div class="actions"><button id="saveBtn" class="primary">✓ Toevoegen aan Dex</button><button id="retryBtn">Nee, opnieuw</button></div></section><section id="dex" class="panel"><div class="head"><div><p class="eyebrow">VERZAMELING</p><h2>Mijn Dex</h2></div><button id="refreshBtn">↻</button></div><div id="grid" class="grid"></div></section></main><nav><button data-go="dex">▦<span>Dex</span></button><button class="scanbtn" data-go="scan">＋<span>Scannen</span></button><button id="statsBtn">★<span>Stats</span></button></nav><dialog id="detail"><button class="close">×</button><img id="detailImg"><p class="eyebrow" id="detailCat"></p><h2 id="detailName"></h2><i id="detailLatin"></i><p id="detailDesc"></p><small id="detailMeta"></small></dialog><script type="module" src="/app.js"></script></body></html>
